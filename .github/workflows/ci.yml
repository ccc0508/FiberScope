name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            database/importer/requirements.txt

      - name: Install PostgreSQL client and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          python -m pip install --upgrade pip
          # MinerU tests use pypdf to generate PDF fixtures.
          pip install -r backend/requirements.txt -r backend/requirements-parsing-review.txt -r database/importer/requirements.txt pypdf==6.21.3

      - name: Initialize PostgreSQL schema, migrations, and Excel imports
        run: |
          python scripts/ci_setup_postgres.py \
            --host 127.0.0.1 \
            --port 5432 \
            --admin-password ci_postgres_password \
            --env-out .ci/app.env

      - name: Run backend test suite (including real PostgreSQL integration tests)
        env:
          TEST_DB_ENV: ${{ github.workspace }}/.ci/app.env
        run: python -m pytest -q -c backend/pytest.ini backend/tests scripts

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Typecheck and build root deployment
        working-directory: frontend
        run: npm run build

      - name: Build subpath deployment (/fiberscope/)
        working-directory: frontend
        run: npx vite build --base=/fiberscope/

  e2e-smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            database/importer/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend, importer, frontend, and Playwright Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-literature.txt -r database/importer/requirements.txt
          npm --prefix frontend ci
          npx --prefix frontend playwright install --with-deps chromium

      - name: Initialize PostgreSQL schema, migrations, and Excel imports
        run: |
          python scripts/ci_setup_postgres.py \
            --host 127.0.0.1 \
            --port 5432 \
            --admin-password ci_postgres_password \
            --app-password ci_app_password \
            --env-out .ci/app.env

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run Playwright smoke tests against live API and Vite preview
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: plant_fiber_db
          PGUSER: fiber_app
          PGPASSWORD: ci_app_password
          CORS_ORIGINS: '["http://127.0.0.1:4173","http://localhost:4173"]'
          SMOKE_BASE_URL: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          (cd backend && uvicorn app.main:app --host 127.0.0.1 --port 8000) > /tmp/uvicorn.log 2>&1 &
          UVICORN_PID=$!
          (cd frontend && npm run preview -- --host 127.0.0.1 --port 4173) > /tmp/vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          cleanup() {
            kill "$UVICORN_PID" "$PREVIEW_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null && curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done

          if ! npm --prefix frontend run test:smoke; then
            echo "=== Uvicorn log ==="
            cat /tmp/uvicorn.log
            echo "=== Vite preview log ==="
            cat /tmp/vite-preview.log
            exit 1
          fi
