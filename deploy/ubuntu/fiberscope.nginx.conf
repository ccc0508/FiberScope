# Include inside the existing HTTP server block; leaves its root location intact.
location = /fiberscope {
    return 301 /fiberscope/;
}

location ^~ /fiberscope/api/ {
    proxy_pass http://127.0.0.1:8010/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_cookie_path /api/ /fiberscope/api/;
    client_max_body_size 12m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    add_header Cache-Control "no-store" always;
}

location ^~ /fiberscope/ {
    root /var/www/fiberscope-public;
    try_files $uri $uri/ /fiberscope/index.html;
    add_header X-Content-Type-Options nosniff always;
}
